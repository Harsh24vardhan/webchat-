<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="light">
  <meta name="theme-color" content="#3B82F6">
  <title>Modern Webchat</title>
  
  <link rel="preconnect" href="https://fs.versalence.online">
  <link rel="preconnect" href="https://chatapp.versalence.online/webchat">
  
  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #3B82F6 0%, #06B6D4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                  visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader {
      width: 64px;
      height: 64px;
      border: 5px solid rgba(255, 255, 255, 0.25);
      border-top-color: white;
      border-radius: 50%;
      
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: white;
      font-size: 18px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
    }

    .loading-dot {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #F8FAFC;
    }

    body.no-scroll {
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* Webchat container scaling */
    #chat-container {
      transform: scale(0.8);
      transform-origin: center center;
      width: 125%;
      height: 125%;
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -62.5%;
      margin-top: -62.5%;
    }

    /* Remove scaling on mobile */
    @media (max-width: 768px) {
      #chat-container {
        transform: none;
        width: 100%;
        height: 100%;
        position: relative;
        left: 0;
        top: 0;
        margin: 0;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
      
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    ::selection {
      background: #DBEAFE;
      color: #1E293B;
    }

    ::-moz-selection {
      background: #DBEAFE;
      color: #1E293B;
    }
  </style>
</head>

<body class="no-scroll">
  
  <div id="loading-screen">
    <div class="loader-container">
      <div class="loader"></div>
      <div class="loading-text">Loading Chat...</div>
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./config.js"></script>

  <script>
    function setViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      
      if (CSS.supports('padding: env(safe-area-inset-top)')) {
        document.documentElement.style.setProperty('--safe-top', 'env(safe-area-inset-top)');
        document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom)');
      }
    }

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(setViewportHeight, 100);
    });

    window.addEventListener('load', () => {
      const loadingScreen = document.getElementById('loading-screen');
      const minimumLoadTime = 800;
      const startTime = performance.now();

      function hideLoadingScreen() {
        const elapsedTime = performance.now() - startTime;
        const remainingTime = Math.max(0, minimumLoadTime - elapsedTime);

        setTimeout(() => {
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
              loadingScreen.remove();
              document.body.classList.add('loaded');
            }, 600);
          }
        }, remainingTime);
      }

      const checkChatReady = setInterval(() => {
        if (document.querySelector('#chat-window')) {
          clearInterval(checkChatReady);
          hideLoadingScreen();
        }
      }, 100);

      setTimeout(() => {
        clearInterval(checkChatReady);
        hideLoadingScreen();
      }, 3000);
    });

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    if (isMobile) {
      document.documentElement.classList.add('mobile-device');
    }
    if (isIOS) {
      document.documentElement.classList.add('ios-device');
    }
    if (isAndroid) {
      document.documentElement.classList.add('android-device');
    }

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.documentElement.classList.add('touch-device');
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => {
      e.preventDefault();
    });

    document.addEventListener('gesturechange', (e) => {
      e.preventDefault();
    });

    document.addEventListener('gestureend', (e) => {
      e.preventDefault();
    });

    function updateOnlineStatus() {
      const status = navigator.onLine ? 'online' : 'offline';
      document.documentElement.setAttribute('data-connection', status);
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    window.addEventListener('error', (event) => {
      console.error('Global error:', event.error);
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.error('Unhandled promise rejection:', event.reason);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        console.log('Page hidden - pausing non-critical operations');
      } else {
        console.log('Page visible - resuming operations');
      }
    });

    window.addEventListener('focus', () => {
      document.documentElement.classList.add('window-focused');
    });

    window.addEventListener('blur', () => {
      document.documentElement.classList.remove('window-focused');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        document.documentElement.classList.add('keyboard-navigation');
      }
    });

    document.addEventListener('mousedown', () => {
      document.documentElement.classList.remove('keyboard-navigation');
    });

    console.log('%câœ¨ Modern Webchat Initialized', 
      'color: #3B82F6; font-size: 16px; font-weight: bold;');
  </script>

</body>

</html>
